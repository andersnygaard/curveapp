# Work waiting on the Curve board: status Todo, or label "Mer arbeid" in any state that is not
# cancelled. Issues labelled "Trenger mer oppfølging" or "Trenger avklaring" wait for an answer from
# the user and are left out.
{
  issues(
    first: 50
    filter: {
      project: { slugId: { eq: "5999feb19281" } }
      labels: { every: { name: { nin: ["Trenger mer oppfølging", "Trenger avklaring"] } } }
      state: { type: { nin: ["canceled", "duplicate"] } }
      or: [
        { state: { name: { eq: "Todo" } } }
        { labels: { some: { name: { eq: "Mer arbeid" } } } }
      ]
    }
  ) {
    nodes {
      identifier
      title
      priority
      state { name }
      labels { nodes { name } }
    }
  }
}
